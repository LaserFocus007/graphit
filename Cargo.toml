[package]
name = "graphit"
version = "0.1.9"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
base64 = "0.23.1"
cairo-rs = { version = "0.22", features = ["png", "pdf"] }
flate2 = "1.1.10"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22"
poppler-rs = "0.26.0"
serde_json = "1.0.154"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
