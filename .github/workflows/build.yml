name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK, libadwaita and poppler
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release
      - name: Build .deb
        run: sh packaging/build-deb.sh
      - uses: actions/upload-artifact@v5
        with:
          name: graphit-linux-deb
          path: graphit_*_amd64.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            zip
      - name: Test
        run: cargo test --release
      - name: Build portable zip
        run: sh packaging/windows/bundle.sh
      - uses: actions/upload-artifact@v5
        with:
          name: graphit-windows
          path: dist/graphit-*-windows-x64.zip
